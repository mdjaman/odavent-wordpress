name: Release

# Runs ONLY when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0). Never on
# pull requests or branch pushes: this is the only workflow that publishes anything.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Test, package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the next step can tell whether the tagged commit is on main.
          fetch-depth: 0

      # Only code that went through main (and its CI) is released: a tag pushed on a side branch fails here.
      # GITHUB_SHA reaches the shell as an environment variable, never interpolated into the script.
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main. Merge it into main (CI green), then tag the merge commit."
            exit 1
          fi

      - name: Check the tag against the plugin header
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not vX.Y.Z"; exit 1 ;;
          esac
          HEADER="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' odavent-events.php | head -n 1)"
          if [ "$HEADER" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match the plugin header Version ($HEADER). Bump the header, readme.txt and CHANGELOG.md, then re-tag."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The plugin's PHP floor, so a syntax the minimum version cannot parse fails the release.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          extensions: zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPCS (PHPCompatibilityWP, PHP 7.4+)
        run: vendor/bin/phpcs

      - name: JS syntax and tests
        run: |
          bin/lint-js
          bin/test-js

      - name: Check translations
        run: php bin/check-translations.php

      - name: Build the plugin zip
        run: php bin/build-zip.php "$VERSION"

      - name: Write the release notes
        run: php bin/release-notes.php "$VERSION" > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" "dist/odavent-events-$VERSION.zip" \
            --title "Odavent Events $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            $PRERELEASE
