# Dev environment for the plugin: a real WordPress, a stub Odavent API and WP-CLI.
# Start it with bin/dev-up (which also installs WordPress and creates the test pages), stop it with
# bin/dev-down. See docs/development.md.
#
# Networking: `stub` and `wpcli` share the network namespace of `wordpress`, so inside all three
# 127.0.0.1:8081 is the stub and localhost:8089 is WordPress itself (Apache listens on 8089 inside the
# container too). The plugin may use the http stub URL because WP_ENVIRONMENT_TYPE is `local`, and
# WordPress' own loopback requests (cron, site health) reach the site URL.
#
# Images: WP_IMAGE (WordPress + Apache + PHP) and WPCLI_IMAGE (WP-CLI on the same PHP version, set by
# bin/dev-up from WP_IMAGE).

name: ${COMPOSE_PROJECT_NAME:-odavent-wp-dev}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'FS_METHOD', 'direct' );
    define( 'AUTOMATIC_UPDATER_DISABLED', true ); // A new install would auto-update a 6.1 site to the latest major mid-test.

x-wp-volumes: &wp-volumes
  - wp:/var/www/html
  - ..:/var/www/html/wp-content/plugins/odavent-events
  - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 90
    volumes:
      - db:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-8091}:3306"

  wordpress:
    image: ${WP_IMAGE:-wordpress:7.1-php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes: *wp-volumes
    ports:
      - "${WP_PORT:-8089}:8089"
    # Apache listens on 8089 inside the container as well, so the site URL works from inside.
    command:
      - bash
      - -c
      - >-
        sed -i 's/^Listen 80$$/Listen 8089/' /etc/apache2/ports.conf &&
        sed -i 's/<VirtualHost \*:80>/<VirtualHost *:8089>/' /etc/apache2/sites-enabled/000-default.conf &&
        exec docker-entrypoint.sh apache2-foreground

  stub:
    image: ${STUB_IMAGE:-php:8.3-cli-alpine}
    network_mode: "service:wordpress"
    depends_on:
      - wordpress
    environment:
      PHP_CLI_SERVER_WORKERS: "8"
    volumes:
      - ./stub:/stub:ro
      - ../tests/fixtures:/fixtures:ro
    command: ["php", "-S", "127.0.0.1:8081", "/stub/index.php"]

  wpcli:
    image: ${WPCLI_IMAGE:-wordpress:cli-2-php8.3}
    network_mode: "service:wordpress"
    depends_on:
      - wordpress
    # The Apache image runs as www-data = 33; the CLI image's own www-data is 82.
    user: "33:33"
    init: true
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CONFIG_PATH: /var/www/html/wp-content/plugins/odavent-events/docker/wp-cli.yml
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp-volumes
    working_dir: /var/www/html
    entrypoint: ["sleep", "infinity"]

volumes:
  db:
  wp:
